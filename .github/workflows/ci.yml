name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check foundation
        run: pnpm check

  ios-placeholder:
    name: iOS placeholder
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Confirm iOS app shell
        run: test -f apps/ios/README.md

  android-placeholder:
    name: Android placeholder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Confirm Android app shell
        run: test -f apps/android/README.md
